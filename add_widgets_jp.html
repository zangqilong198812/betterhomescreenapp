    <main class="legal">
      <h1>ウィジェットの追加方法</h1>
      <p class="subtle">チュートリアル</p>
      <div class="markdown-content">
        <ol>
          <li>
            ホーム画面を長押しし、左上の編集ボタンをタップ。
            <img
              src="https://rtquickidea.oss-cn-beijing.aliyuncs.com/besttheme/TutorialPic/widget_tutorial/jp/IMG_0062-portrait.png"
              alt="編集ボタンをタップ"
            />
          </li>
          <li>
            表示されたメニューでウィジェットを追加を選択。
            <img
              src="https://rtquickidea.oss-cn-beijing.aliyuncs.com/besttheme/TutorialPic/widget_tutorial/jp/IMG_0063-portrait.png"
              alt="ウィジェットを追加"
            />
          </li>
          <li>
            検索ボックスに Minimalist と入力。
            <img
              src="https://rtquickidea.oss-cn-beijing.aliyuncs.com/besttheme/TutorialPic/widget_tutorial/jp/IMG_0064-portrait.png"
              alt="Minimalist を検索"
            />
          </li>
          <li>
            使用するウィジェットをスワイプして選択。
            <img
              src="https://rtquickidea.oss-cn-beijing.aliyuncs.com/besttheme/TutorialPic/widget_tutorial/jp/IMG_0065-portrait.png"
              alt="ウィジェットを選択"
            />
          </li>
        </ol>
      </div>
