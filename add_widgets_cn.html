    <main class="legal">
      <h1>如何添加小组件</h1>
      <p class="subtle">教程</p>
      <div class="markdown-content">
        <ol>
          <li>
            长按主屏幕上的任意位置，并轻点左上角编辑按钮。
            <img
              src="https://rtquickidea.oss-cn-beijing.aliyuncs.com/besttheme/TutorialPic/widget_tutorial/cn/IMG_0070-portrait.png"
              alt="进入编辑模式"
            />
          </li>
          <li>
            弹出的菜单中选择添加小组件。
            <img
              src="https://rtquickidea.oss-cn-beijing.aliyuncs.com/besttheme/TutorialPic/widget_tutorial/cn/IMG_0059-portrait.png"
              alt="选择添加小组件"
            />
          </li>
          <li>
            在搜索框中输入极简桌面。
            <img
              src="https://rtquickidea.oss-cn-beijing.aliyuncs.com/besttheme/TutorialPic/widget_tutorial/cn/IMG_0060-portrait.png"
              alt="搜索极简桌面"
            />
          </li>
          <li>
            滑动选择您需要使用的小组件。
            <img
              src="https://rtquickidea.oss-cn-beijing.aliyuncs.com/besttheme/TutorialPic/widget_tutorial/cn/IMG_0061-portrait.png"
              alt="选择小组件"
            />
          </li>
        </ol>
      </div>
      <p class="subtle">
